---
deployment:
  tasks:
    # ---------------------------------------------------------------
    # Nothing here needs editing.
    #
    # This account hosts several sites. public_html belongs to the main
    # domain, jandyrecall.com, and each additional domain reads from its
    # own folder inside it. jandy.us reads from public_html/jandy.us,
    # so the app is deployed there and served at:
    #
    #     https://jandy.us/onboarding
    #
    # $HOME avoids hardcoding the cPanel username. Only this folder is
    # ever written to; no other site on the account is touched.
    # ---------------------------------------------------------------
    - export DEPLOYPATH=$HOME/public_html/jandy.us/onboarding

    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/config
    - /bin/cp -R src $DEPLOYPATH/
    - /bin/cp -R templates $DEPLOYPATH/
    - /bin/cp -R public $DEPLOYPATH/
    - /bin/cp -R db $DEPLOYPATH/
    - /bin/cp -R tools $DEPLOYPATH/
    - /bin/cp config/config.sample.php $DEPLOYPATH/config/config.sample.php
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess
    # config/config.php is deliberately never copied. It holds your
    # database credentials and lives only on the server.
