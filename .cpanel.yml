---
deployment:
  tasks:
    # ---------------------------------------------------------------
    # Nothing here needs editing.
    #
    # $HOME is your cPanel account's home folder, so this works without
    # hardcoding a username. The app is served at
    # https://yourdomain.com/onboarding
    #
    # If a deploy ever fails saying the path does not exist, replace
    # $HOME with the absolute path shown in cPanel's General Information
    # panel, for example /home/abc123def.
    # ---------------------------------------------------------------
    - export DEPLOYPATH=$HOME/public_html/onboarding

    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/config
    - /bin/cp -R src $DEPLOYPATH/
    - /bin/cp -R templates $DEPLOYPATH/
    - /bin/cp -R public $DEPLOYPATH/
    - /bin/cp -R db $DEPLOYPATH/
    - /bin/cp -R tools $DEPLOYPATH/
    - /bin/cp config/config.sample.php $DEPLOYPATH/config/config.sample.php
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess
    # config/config.php is deliberately never copied. It holds your
    # database credentials and lives only on the server.
